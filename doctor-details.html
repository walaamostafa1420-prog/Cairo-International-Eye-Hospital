<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الطبيب | CIEH</title>

    <link rel="stylesheet" href="hosptial.css">

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet">
</head>

<body>

<header class="navbar">

    <div class="container navbar-container">

        <a href="index.html" class="logo">

            <div class="logo-icon">
                <i class="ri-eye-line"></i>
            </div>

            <div class="logo-text">
                <strong>CIEH</strong>
                <span>Cairo International Eye Hospital</span>
            </div>

        </a>

    </div>

</header>


<main>

    <section class="section">

        <div class="container">

            <div class="section-header">

                <span class="section-label">
                    DOCTOR DETAILS
                </span>

                <h1>
                    تفاصيل الطبيب
                </h1>

            </div>


            <div class="doctor-details-card">

                <h2 id="doctorName">
                    اسم الطبيب
                </h2>

                <p id="doctorSpecialty">
                    تخصص الطبيب
                </p>

                <a id="selectDoctorBtn"
                   href="#"
                   class="btn btn-primary">

                    اختيار هذا الدكتور

                    <i class="ri-arrow-left-line"></i>

                </a>

            </div>

        </div>

    </section>

</main>


<script>

const doctors = {

    1: {
        name: "د. أحمد ربيع أبو الحسن",
        specialty: "أخصائي طب وجراحة العيون"
    },

    2: {
        name: "د. كريم أبو العز",
        specialty: "استشاري طب وجراحة العيون وجراحات الشبكية والجسم الزجاجي والليزر"
    },

    3: {
        name: "أ.د عمرو الأسود",
        specialty: "استشاري القرنية وجراحات المياه البيضاء وتصحيح الإبصار"
    }

};


const params = new URLSearchParams(window.location.search);

const doctorId = params.get("doctor");

const doctor = doctors[doctorId];


if (doctor) {

    document.getElementById("doctorName").textContent =
        doctor.name;

    document.getElementById("doctorSpecialty").textContent =
        doctor.specialty;

    document.getElementById("selectDoctorBtn").href =
        "dashboard/index.html?doctor=" + doctorId;

}

</script>

</body>

</html>
