<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Create Account | Cairo International Eye Hospital
    </title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="auth.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card register-card">

        

        <a href="index.html"
           class="auth-logo">

            <div class="logo-icon">
                <i class="ri-eye-line"></i>
            </div>

            <div class="logo-text">

                <strong>CIEH</strong>

                <span>
                    Cairo International Eye Hospital
                </span>

            </div>

        </a>


    

        <div class="auth-header">

            <h1>Create Account</h1>

            <p>
                Create your account to access our services
            </p>

        </div>


        

        <form class="auth-form">

            

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-box">

                    <i class="ri-user-line"></i>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="ri-mail-line"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <div class="input-box">

                    <i class="ri-phone-line"></i>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i class="ri-lock-line"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

            </div>


            

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <i class="ri-lock-password-line"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

            </div>


            

            <label class="terms">

                <input type="checkbox"
                       required>

                <span>
                    I agree to the Terms & Conditions
                </span>

            </label>


            

            <button type="submit"
                    class="auth-btn">

                Create Account

                <i class="ri-arrow-right-line"></i>

            </button>

        </form>

        <div class="auth-footer">

            <span>
                Already have an account?
            </span>

            <a href="login.html">
                Login
            </a>

        </div>


    

        <a href="index.html"
           class="back-home">

            <i class="ri-arrow-left-line"></i>

            Back to Home

        </a>

    </div>

</div>

</body>
</html>
