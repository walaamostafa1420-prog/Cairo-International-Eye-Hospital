<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Cairo International Eye Hospital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
          rel="stylesheet">

    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <!-- LOGO -->

        <a href="index.html" class="auth-logo">

            <div class="logo-icon">
                <i class="ri-eye-line"></i>
            </div>

            <div class="logo-text">
                <strong>CIEH</strong>
                <span>Cairo International Eye Hospital</span>
            </div>

        </a>


        <!-- TITLE -->

        <div class="auth-header">

            <h1>Welcome Back</h1>

            <p>
                Login to your account to continue
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form class="auth-form">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="ri-mail-line"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i class="ri-lock-line"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword()">

                        <i class="ri-eye-off-line"></i>

                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="form-options">

                <label class="remember">

                    <input type="checkbox">

                    <span>Remember me</span>

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit" class="auth-btn">

                Login

                <i class="ri-arrow-right-line"></i>

            </button>

        </form>


        <!-- REGISTER -->

        <div class="auth-footer">

            <span>
                Don't have an account?
            </span>

            <a href="register.html">
                Create Account
            </a>

        </div>


        <!-- BACK -->

        <a href="index.html" class="back-home">

            <i class="ri-arrow-left-line"></i>

            Back to Home

        </a>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const icon =
        document.querySelector(".password-toggle i");

    if (password.type === "password") {

        password.type = "text";

        icon.className = "ri-eye-line";

    } else {

        password.type = "password";

        icon.className = "ri-eye-off-line";

    }

}

</script>

</body>
</html>
